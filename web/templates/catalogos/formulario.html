{% extends "base.html" %}
{% block title %}{{ titulo }} · Gestão da loja{% endblock %}
{% block content %}
<div class="page-heading"><h1>{{ titulo }}</h1></div>
{% if erro %}<p class="notice error" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="card product-form">
<input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
<div class="field"><label for="nome">Nome</label><input id="nome" name="nome" maxlength="100" required value="{{ nome }}"></div>
<div class="actions"><button type="submit">Salvar</button><a href="{{ url_for(modulo ~ '.lista') }}">Voltar à lista</a></div>
</form>
{% endblock %}
